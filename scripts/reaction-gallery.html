<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Household reaction gallery</title><style>
:root{font:15px system-ui,sans-serif;color:#233c32;background:#f8f9f5;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:1400px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px}p{line-height:1.5}.toolbar{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;background:#f8f9f5}button{min-height:44px;padding:8px 16px;border:1px solid #aab6a4;border-radius:8px;background:white;color:inherit;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #7130ad;outline-offset:3px}button[aria-pressed=true]{background:#edf2e8;border-color:#335d43}button:disabled{opacity:.6;cursor:default}#motion-status{font-size:13px;color:#5e6b62}#gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.reaction-example{min-width:0;border:1px solid #dce3d8;border-radius:12px;background:white;padding:12px}.reaction-example.active{outline:2px solid #335d43;outline-offset:2px}.reaction-example h2{margin:0;font-size:15px}.reaction-example p{margin:4px 0 8px;font-size:13px;color:#5e6b62}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:4px}.frame{min-width:0;margin:0;position:relative}.frame img,.frame canvas{display:block;width:100%;aspect-ratio:1;object-fit:contain}.frame canvas{position:absolute;top:0;left:0}.frame figcaption{font-size:11px;text-align:center;color:#5e6b62}.reaction-example button{width:100%;margin-top:10px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:1100px){#gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){main{padding:16px}#gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:479px){#gallery{grid-template-columns:1fr}.comparison{max-width:300px;margin:auto}}@media(prefers-color-scheme:dark){:root{background:#101712;color:#e3ebdf;color-scheme:dark}.toolbar{background:#101712}.reaction-example,button{background:#18221b;border-color:#344332}.reaction-example p,#motion-status,.frame figcaption{color:#a4b19e}button[aria-pressed=true]{background:#253422;border-color:#bed79c}.reaction-example.active{outline-color:#bed79c}}
</style></head><body><main><h1>Reaction gallery</h1><p>14 reactions × four housemates. Compare the animated expression with its still frame. Select a reaction to play it.</p><div class="toolbar"><button id="pause" type="button" aria-pressed="false">Pause motion</button><button id="replay" type="button" disabled>Replay selected</button><span id="motion-status" role="status"></span></div><div id="gallery" aria-label="56 character and reaction comparisons"></div></main><script type="module" src="/gallery.js"></script></body></html>
