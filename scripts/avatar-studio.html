<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The household · Avatar collection</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:#27382f;font:15px/1.5 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:36px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}header span{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#74836b}h1{font-size:clamp(27px,4vw,44px);letter-spacing:-1.5px;line-height:1.2;margin:26px 0 12px}h2{font-size:15px;margin:0}p{color:#77816f;margin:0 0 24px}.portraits{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.portrait{text-align:center;background:#fcfcf6;border:1px solid #dee3d5;border-radius:18px;padding:16px}.portrait img{width:105px;max-width:100%;display:block;margin:auto}.portrait span{font-size:12px}.control{position:sticky;top:0;z-index:2;padding:18px 24px;border:1px solid #dbe1d1;background:#fcfcf6f5;backdrop-filter:blur(12px);border-radius:18px;margin-bottom:22px;box-shadow:0 8px 20px #213b2410}.control-top{display:flex;gap:14px;justify-content:space-between;align-items:center}.control input[type=range]{width:100%;accent-color:#4b6b50;margin:15px 0}.presets{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;font-size:12px;border:1px solid #cad5c1;background:#f0f3e8;border-radius:8px;padding:7px 12px;color:#36543c;cursor:pointer}button[aria-pressed=true]{background:#d9e8cb;border-color:#4e6b3e}button:focus-visible,input:focus-visible{outline:3px solid #51a6bd;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.card{background:radial-gradient(ellipse at center,#45594f,#20332b);border-radius:24px;color:#edf1dc;overflow:hidden;padding:18px}.card-top{display:flex;justify-content:space-between;font-size:11px;color:#b6c6aa}.card canvas{display:block;width:100%;height:365px}.samples{display:flex;gap:8px;justify-content:center;border-top:1px solid #c6dbc526;padding-top:12px}.samples img{width:48px;height:48px}.samples figure{margin:0;text-align:center}.samples figcaption{font-size:9px;color:#bccbb3}.footer{font-size:12px;margin-top:22px}#error{color:#9f3025}#value{font-variant-numeric:tabular-nums}@media(max-width:650px){main{padding:22px 15px}header span{font-size:9px}.portraits{gap:6px}.portrait{padding:9px 4px}.portrait img{width:70px}.grid{grid-template-columns:1fr}.card canvas{height:290px}.control{padding:14px}.samples img{width:42px;height:42px}.presets{gap:5px}.presets button{padding:6px 8px;font-size:11px}}
</style></head><body><main><header><strong>h. &nbsp; household / character studio</strong><span>Final collection · v1</span></header><h1>Four familiar faces.</h1><p>The approved smiles for everyday moments. A full range of feelings for everything else.</p><h2>Everyday portraits</h2><div class="portraits" id="portraits"></div><section class="control" aria-label="Animation controls"><div class="control-top"><strong id="mood">Neutral</strong><output id="value" for="temperature">0</output><button id="motion" aria-pressed="false">Pause motion</button></div><input id="temperature" aria-label="Mood temperature" type="range" min="-100" max="100" value="0"><div class="presets"><button data-value="-100">Full steam</button><button data-value="-40">Annoyed</button><button data-value="0">Neutral</button><button data-value="45">Warm thanks</button><button data-value="100">All the love</button></div></section><p id="error" role="alert" hidden></p><div class="grid" id="grid"></div><p class="footer">Transparent WebP portraits and expressions · Shared animation module · Reduced motion supported</p></main>
<script type="module">
try{
 const base='./avatars/v1/',manifest=await(await fetch(base+'manifest.json')).json();
 const {mountAvatar}=await import(base+manifest.module);
 const controllers={};const members=Object.keys(manifest.characters);
 for(const member of members){const a=manifest.characters[member];
  document.querySelector('#portraits').insertAdjacentHTML('beforeend',`<div class="portrait"><img src="${base+a.happy256}" alt="${a.name}, approved smiling portrait"><span>${a.name}</span></div>`);
  document.querySelector('#grid').insertAdjacentHTML('beforeend',`<article class="card"><div class="card-top"><h2>${a.name}</h2><span>Animated expression</span></div><canvas id="avatar-${member}"></canvas><div class="samples">${['neutral','annoyed','angry','grateful','loving'].map(state=>`<figure><img src="${base+a[state]}" alt="${a.name}, ${state}"><figcaption>${state}</figcaption></figure>`).join('')}</div></article>`);
  controllers[member]=await mountAvatar(document.querySelector('#avatar-'+member),{member,assetBaseUrl:base});
 }
 const slider=document.querySelector('#temperature'),output=document.querySelector('#value');
 function setTemperature(value,immediate=false){slider.value=value;output.value=value>0?'+'+value:value;document.querySelector('#mood').textContent=value<-75?'Full steam':value<0?'A little annoyed':value===0?'Neutral':value<75?'Warm thanks':'All the love';for(const c of Object.values(controllers))c.setTemperature(Number(value),immediate);}
 slider.addEventListener('input',()=>setTemperature(slider.value));
 for(const button of document.querySelectorAll('[data-value]'))button.onclick=()=>setTemperature(Number(button.dataset.value));
 let paused=false;document.querySelector('#motion').onclick=e=>{paused=!paused;for(const c of Object.values(controllers))c[paused?'pause':'resume']();e.target.textContent=paused?'Resume motion':'Pause motion';e.target.setAttribute('aria-pressed',paused);};
 window.avatarGallery={ready:true,controllers,manifest,setTemperature};
 window.addEventListener('pagehide',()=>{for(const c of Object.values(controllers))c.destroy();},{once:true});
}catch(error){document.querySelector('#error').hidden=false;document.querySelector('#error').textContent=error.message;}
</script></body></html>
