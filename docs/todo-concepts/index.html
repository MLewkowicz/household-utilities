<html lang="en">

<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#223b32;background:#f5f3eb;font-synthesis:none;--ink:#223b32;--muted:#66736b;--line:#dedfd4;--green:#365c47;--paper:#fffef9;--personal:#eee5f6;--assigned:#e5eddf;--open:#fbefdc;--rotation:#e3edf2}
*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default}button,a,select{touch-action:manipulation}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #738fce;outline-offset:3px}button{border:0;background:none}h1,h2,h3,p{margin:0}svg{width:20px;height:20px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}button svg{pointer-events:none}[hidden]{display:none!important}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.muted{color:var(--muted)}

.studio{max-width:1370px;margin:auto;padding:28px 32px 40px}.studio-heading{display:flex;align-items:start;justify-content:space-between;gap:24px}.studio-heading h1{font-family:Georgia,serif;font-size:37px;letter-spacing:-1.2px;font-weight:400;margin:8px 0}.studio-heading p{max-width:740px;font-size:14px;line-height:1.6;color:var(--muted)}.sample-tag{font-size:11px;background:#e7ecdf;color:#435c48;border:1px solid #d1dac8;border-radius:30px;padding:9px 13px;white-space:nowrap}.studio-controls{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:24px 0 14px}.concept-switch,.device-switch{display:flex;background:#e9e9df;border:1px solid var(--line);padding:4px;border-radius:12px;gap:4px}.concept-switch button,.device-switch button{padding:11px 15px;border-radius:8px;font-size:12px;min-height:42px}.concept-switch button[aria-pressed=true],.device-switch button[aria-pressed=true]{background:var(--paper);box-shadow:0 2px 5px #243b3010;font-weight:650}.concept-switch b{margin-right:7px;color:var(--muted)}.design-note{min-height:54px;display:flex;align-items:baseline;gap:12px;font-size:13px;line-height:1.6;padding:0 2px 14px}.design-note strong{white-space:nowrap}.design-note span{color:var(--muted)}.preview-well{background:#e3e5dc;border:1px solid #d7dacd;border-radius:20px;padding:24px;overflow:auto;min-height:620px}.preview-frame{display:block;margin:auto;border:1px solid #d4d8cb;border-radius:14px;background:#f5f3eb;width:100%;height:800px;box-shadow:0 10px 28px #3443340b}.preview-frame.phone{width:390px;max-width:100%;height:844px;border:7px solid #fdfdf8;border-radius:28px;box-shadow:0 12px 24px #34433416}.compare{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;min-width:1000px}.compare h2{font-size:15px;font-weight:600;margin:0 0 6px}.compare p{font-size:12px;color:var(--muted);min-height:44px;line-height:1.5}.compare .preview-frame{width:100%;height:800px;border:5px solid #fffef9;border-radius:22px}.studio-footer{display:flex;justify-content:space-between;gap:16px;padding:18px 0 0;font-size:12px;color:var(--muted);line-height:1.7}.studio-footer a{color:var(--green)}
/* Shared household styling across all three concepts. */
.app{max-width:1180px;margin:auto;padding:0 28px 24px}.app-header{display:flex;align-items:center;justify-content:space-between;height:75px;border-bottom:1px solid var(--line);gap:16px}.wordmark{font-family:Georgia,serif;font-size:22px;display:flex;align-items:center;gap:9px}.app-nav{display:flex;gap:22px;font-size:12px;color:var(--muted)}.app-nav .current{color:var(--green);font-weight:650}.person{display:flex;align-items:center;gap:8px;font-size:12px}.avatar{width:29px;height:29px;background:#dfd2ee;border:1px solid #d0bedf;display:inline-grid;place-items:center;border-radius:50%;font-size:11px;font-weight:700;flex-shrink:0}.page-heading{display:flex;justify-content:space-between;align-items:center;margin:27px 0 17px;gap:12px}.page-heading h1{font-family:Georgia,serif;font-size:36px;font-weight:400;letter-spacing:-1px}.page-heading p{font-size:12px;color:var(--muted);margin-top:7px}.primary{border-radius:10px;background:var(--green);color:white;padding:11px 16px;font-size:12px;min-height:44px}.secondary{border:1px solid var(--line);background:var(--paper);padding:10px 15px;border-radius:9px;min-height:44px;font-size:12px}.heading-actions{display:flex;gap:8px}.summary-line{display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-bottom:22px}.summary-line .dot{width:5px;height:5px;background:#99aa8c;border-radius:50%}.sample-select{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px}.sample-select select{background:transparent;border:0;font-size:11px;min-height:32px;padding:3px 5px;border-bottom:1px solid #ccd2c2}.board{display:grid;gap:16px}.panel{--tint:var(--personal);background:var(--paper);border:1px solid var(--line);border-radius:15px;min-width:0;overflow:hidden}.personal{--tint:var(--personal);--accent:#71578a}.assigned{--tint:var(--assigned);--accent:#486747}.open{--tint:var(--open);--accent:#977038}.rotation{--tint:var(--rotation);--accent:#456c80}.panel-head{display:flex;align-items:center;gap:10px;padding:16px 17px 11px}.category-icon{display:grid;place-items:center;background:var(--tint);border-radius:9px;width:35px;height:35px;flex:none;color:var(--accent)}.panel-head h2{font-size:14px;font-weight:650;line-height:1.3}.panel-head p{font-size:10px;color:var(--muted);margin-top:4px}.count{font-size:11px;font-weight:600;color:var(--accent);padding:4px 7px;background:var(--tint);border-radius:7px;margin-left:auto}.items{padding:0 16px}.task{width:100%;display:flex;align-items:center;text-align:left;gap:10px;padding:12px 0;border-bottom:1px solid #e9eae1;min-height:60px}.task:last-child{border-bottom:0}.task:hover .task-name{text-decoration:underline;text-decoration-color:#9cac97;text-underline-offset:3px}.check-ring{height:17px;width:17px;border:1.4px solid #adb8a5;border-radius:5px;flex:none;background:#ffffff60}.task-copy{min-width:0;flex:1}.task-name{display:block;font-size:12px;font-weight:550;line-height:1.4;overflow-wrap:anywhere}.task-meta{display:block;font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}.points{font-size:10px;white-space:nowrap;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 5px}.panel-foot{display:flex;justify-content:space-between;align-items:center;background:#f8f8f1;border-top:1px solid #e7e9df;margin-top:6px;min-height:43px;padding:0 15px;font-size:11px}.panel-foot button{min-height:42px;font-size:11px;color:var(--green)}.panel-foot svg{width:14px;height:14px}.panel-foot .view-all{font-weight:600}.board.overview{grid-template-columns:repeat(2,minmax(0,1fr))}.overview .panel-head{background:linear-gradient(115deg,var(--tint),#fffef9 82%);padding-bottom:14px}.overview .items{min-height:132px}.bottom-line{margin-top:18px;display:flex;gap:18px;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}.bottom-line button{font-size:11px;padding:8px 0;min-height:36px;color:var(--green)}.empty{padding:24px 0;font-size:12px;color:var(--muted);line-height:1.5}
/* B: aligned category lanes; previews run across the row. */
.board.lanes{gap:12px}.lanes .panel{display:grid;grid-template-columns:185px minmax(0,1fr) 85px;align-items:stretch}.lanes .panel-head{background:var(--tint);padding:17px 14px;align-items:center}.lanes .category-icon{width:24px;height:24px;background:none}.lanes .panel-head p{display:none}.lanes .panel-head h2{font-size:13px}.lanes .count{background:#ffffff80;font-size:10px;margin-left:0}.lanes .items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;gap:16px;padding:13px 18px}.lanes .task{border:0;padding:5px 0;min-height:65px}.lanes .task .check-ring{display:none}.lanes .task .points{display:none}.lanes .panel-foot{margin:0;padding:0 12px;border-top:0;border-left:1px solid var(--line);justify-content:center;background:none}.lanes .panel-foot .add-in-category{display:none}.lanes .panel-foot .view-all{font-size:10px}.lanes .empty{grid-column:1/-1}
/* C: every category stays in view while one gets full-size cards. */
.focus-layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:22px;align-items:start}.category-index{display:grid;gap:10px}.category-tile{border:1px solid var(--line);background:var(--paper);border-radius:13px;padding:16px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:6px;min-height:98px}.category-tile[aria-pressed=true]{background:var(--tint);border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.category-tile strong{font-size:13px;align-self:center}.category-tile .count{grid-column:2;grid-row:1;margin:0}.category-tile small{grid-column:1/-1;color:var(--muted);font-size:11px;line-height:1.5}.focus-heading{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}.focus-heading h2{font-size:19px;font-weight:600}.focus-heading p{font-size:11px;color:var(--muted);margin:6px 0 0}.focus-heading button{font-size:12px;min-height:44px}.focus-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.focus-card{background:var(--tint);border:1px solid #d9d7cf;border-radius:13px;padding:17px;min-height:170px;position:relative}.focus-card .card-label{font-size:10px;color:var(--muted);margin-bottom:16px;display:block}.focus-card h3{font-size:16px;line-height:1.4;font-weight:600;margin-bottom:7px}.focus-card p{font-size:11px;line-height:1.5;color:var(--muted)}.card-actions{display:flex;align-items:center;justify-content:space-between;margin-top:20px;gap:10px}.card-actions button{min-height:40px;font-size:11px;padding:9px 10px;background:#ffffff70;border:1px solid #ffffff60;border-radius:8px}.card-actions .details{padding:9px 3px;background:none;border:0;color:var(--green)}.context-note{padding:14px 0;font-size:11px;line-height:1.6;color:var(--muted)}
/* In-memory interactions, shared by all studies. */
dialog{width:440px;max-width:calc(100vw - 28px);padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--paper);color:var(--ink);max-height:85dvh;overflow:auto;box-shadow:0 20px 60px #1c352330}dialog::backdrop{background:#20382d50;backdrop-filter:blur(3px)}.dialog-head{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:16px}.dialog-head h2{font-family:Georgia,serif;font-weight:400;font-size:27px;line-height:1.2}.close-dialog{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;flex:none;font-size:20px}.dialog-meta{font-size:12px;line-height:1.8;color:var(--muted);margin-bottom:20px}.dialog-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.dialog-list .task{min-height:66px}.dialog-label{font-size:12px;display:block;margin:18px 0 7px}.dialog-input{background:#fff;border:1px solid #cfd5c9;border-radius:9px;padding:12px;width:100%;font-size:14px}.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);border-radius:11px;padding:10px 14px;color:white;background:#254633;box-shadow:0 4px 16px #243b3020;max-width:calc(100vw - 28px);width:max-content;font-size:12px;display:flex;align-items:center;gap:14px;z-index:5}.toast button{color:white;text-decoration:underline;min-height:32px;font-size:12px}.sample-note{font-size:10px;letter-spacing:.015em;color:var(--muted)}
@media(min-width:1000px){.overview .items{min-height:140px}.overview .task{min-height:69px}.overview .panel-head{padding-top:18px;padding-bottom:17px}.overview .panel-head h2{font-size:15px}.overview .task-name{font-size:13px}}
@media(max-width:700px){.app{padding:0 16px 18px}.app-header{height:61px}.wordmark{font-size:19px}.app-nav{display:none}.person{font-size:11px}.person .avatar{width:27px;height:27px}.page-heading{margin:21px 0 14px}.page-heading h1{font-size:31px}.page-heading p{font-size:11px}.heading-actions .secondary{display:none}.heading-actions .primary{padding:10px 13px;font-size:11px}.summary-line{gap:6px;margin-bottom:17px;font-size:10px}.sample-select{font-size:10px;gap:0}.sample-select select{font-size:10px;max-width:87px}.sample-select>span{display:none}.board.overview{gap:11px}.overview .panel-head{padding:13px 11px 11px;gap:7px;flex-wrap:wrap;position:relative}.overview .category-icon{width:27px;height:27px;border-radius:7px}.overview .category-icon svg{width:17px;height:17px}.overview .panel-head>div:not(.category-icon){order:2;width:100%}.overview .panel-head h2{font-size:12px}.overview .panel-head p{font-size:10px;margin-top:3px}.overview .panel-head .count{position:absolute;top:14px;right:11px;font-size:10px}.overview .items{padding:0 11px;min-height:142px}.overview .task{min-height:69px;gap:7px;align-items:flex-start;padding:12px 0 9px}.overview .check-ring{width:13px;height:13px;border-radius:4px;margin-top:3px}.overview .task-name{font-size:11px}.overview .task-meta{font-size:10px}.overview .points{display:none}.overview .panel-foot{padding:0 10px;min-height:39px;font-size:10px}.overview .panel-foot button{font-size:10px;min-height:39px}.overview .add-in-category{width:30px}.overview .add-in-category span{display:none}.overview .panel-foot svg{width:12px}.bottom-line{gap:8px;font-size:10px;margin-top:12px}.bottom-line button{font-size:10px}.bottom-line .sample-note{display:none}.lanes{gap:11px!important}.lanes .panel{grid-template-columns:1fr 65px}.lanes .panel-head{grid-column:1/-1;padding:9px 12px;gap:7px}.lanes .category-icon{width:20px;height:20px}.lanes .category-icon svg{width:17px;height:17px}.lanes .panel-head h2{font-size:12px}.lanes .count{margin-left:auto;font-size:10px;padding:2px 6px}.lanes .items{grid-template-columns:1fr;padding:5px 13px;gap:0}.lanes .items .task{display:none;min-height:53px}.lanes .items .task:first-child{display:flex}.lanes .task-name{font-size:12px}.lanes .task-meta{font-size:10px}.lanes .panel-foot{padding:0 7px}.lanes .panel-foot .view-all svg{display:none}.focus-layout{grid-template-columns:1fr;gap:21px}.category-index{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.category-tile{padding:12px;min-height:86px;gap:6px}.category-tile strong{font-size:12px}.category-tile small{font-size:10px}.category-tile .count{font-size:10px;padding:3px 5px}.focus-heading{margin-bottom:12px}.focus-heading h2{font-size:18px}.focus-cards{grid-template-columns:1fr;gap:12px}.focus-card{min-height:161px}.focus-card .card-label{margin-bottom:12px}.focus-card h3{font-size:16px}.context-note{font-size:10px}.studio{padding:22px 16px}.studio-heading{display:block}.studio-heading h1{font-size:32px}.sample-tag{display:inline-block;margin-top:12px}.concept-switch{width:100%}.concept-switch button{flex:1;padding:9px 6px;font-size:11px}.concept-switch b{display:block;margin:0 0 3px}.design-note{display:block;font-size:12px;min-height:90px}.design-note strong{display:block;margin-bottom:4px}.preview-well{padding:12px 6px;border-radius:15px}.studio-footer{display:block}.studio-footer p{margin-bottom:9px}}
@media(prefers-reduced-motion:no-preference){.task,.category-tile{transition:background .15s}.task:hover{background:#ebefe344}}
</style>

<body>
<div id="root"></div>
<script>
'use strict';
const params=new URLSearchParams(location.search),demo=params.has('demo');
const icons={home:'<path d="m3 10 7-7 7 7v7H4v-7M8 17v-5h4v5"/>',personal:'<path d="M6 3h10v14H4V5h2M7 7h6M7 10h6M7 13h4"/>',assigned:'<circle cx="10" cy="6" r="3"/><path d="M4 17v-2a6 6 0 0 1 12 0v2M14 6l2 2 3-4"/>',open:'<path d="M3 10h14l-1 7H4l-1-7M6 10l4-7 4 7M7 13v1M13 13v1"/>',rotation:'<path d="M16 7a6 6 0 0 0-10-3L3 7m0-4v4h4M4 13a6 6 0 0 0 10 3l3-3m0 4v-4h-4"/>',arrow:'<path d="M4 10h12m-5-5 5 5-5 5"/>',plus:'<path d="M10 4v12M4 10h12"/>'};
const icon=name=>`<svg viewBox="0 0 20 20" aria-hidden="true">${icons[name]||icons.personal}</svg>`;
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const concepts={overview:{letter:'A',name:'Overview grid',title:'A little of every category.',description:'Four panels stay visible together. Each shows two tasks and the remaining count; open a panel for its full list.',tradeoff:'The original overview for comparison.'},lanes:{letter:'B',name:'Category lanes',title:'More room where you need it.',description:'Personal groups and collapsible lanes. Swipe compact paper tiles to finish; lift their corners for edit, pin, remove, and history. Empty lanes disappear.',tradeoff:'Shared chores ask who helped before completing, with equal credit for everyone selected.'},focus:{letter:'C',name:'Overview + focus',title:'All categories in view. Room for one.',description:'A permanent category overview sits alongside full-size cards. Selecting a category changes the detail area without losing the overview.',tradeoff:'Keeps the familiar cards; only one category’s full task list is visible.'}};
let concept=Object.hasOwn(concepts,params.get('concept'))?params.get('concept'):'lanes';
const conceptUrl=id=>id==='lanes'?'./lanes.html':`?demo=1&concept=${id}`;
const categories=[{id:'personal',title:'Personal',hint:'Just for you',short:'Your own list'},{id:'assigned',title:'Assigned to me',hint:'Someone is counting on you',short:'Your shared tasks'},{id:'open',title:'Anyone can help',hint:'Available to pick up',short:'Unassigned tasks'},{id:'rotation',title:'Taking turns',hint:'One turn at a time',short:'Routines & rotations'}];
const samples=[
{id:'p1',category:'personal',title:'Send project notes',meta:'Work · Today',details:'Personal task · Work group. Organized in your personal list.',due:true},
{id:'p2',category:'personal',title:'Book a haircut',meta:'Life admin · This week',details:'Personal task · Life admin group.'},
{id:'p3',category:'personal',title:'Read the next chapter',meta:'Personal · No due date',details:'Personal task · No deadline.'},
{id:'a1',category:'assigned',title:'Empty dishwasher',meta:'You · Today · 1 pt',points:'1 pt',details:'Assigned to Michal · Requested by Rina. Empty the clean dishes and put everything away.',due:true},
{id:'a2',category:'assigned',title:'Pick up the parcel',meta:'You · No due date',details:'Assigned to Michal · Requested by Rohil. A shared favor with no household points.'},
{id:'a3',category:'assigned',title:'Water the plants',meta:'You · Tomorrow · 1 pt',points:'1 pt',details:'Assigned to Michal · Requested by Rina. Water the plants by the living room window.'},
{id:'o1',category:'open',title:'Start dishwasher',meta:'Anyone · 0.25 pts',points:'0.25 pts',details:'Unassigned · Requested by Rina. Anyone can take this on.'},
{id:'o2',category:'open',title:'Take out recycling',meta:'Anyone · 0.5 pts',points:'0.5 pts',details:'Unassigned · Requested by Michal. Anyone can take this on.'},
{id:'o3',category:'open',title:'Wipe kitchen counter',meta:'Anyone · 1 pt',points:'1 pt',details:'Unassigned · Requested by Rohil. Anyone can take this on.'},
{id:'r1',category:'rotation',title:'Buy milk',meta:'You’re next · As needed',details:'Example rotation only. Michal → Rohil → Rina. No due date and no points. The next turn stays visible until someone completes it.',owners:['Michal','Rohil','Rina'],turn:0},
{id:'r2',category:'rotation',title:'Bring the bins back',meta:'Rina’s turn · Tomorrow',points:'0.5 pts',details:'Example scheduled rotation. Rina has the next turn; Rohil follows.',owners:['Rina','Rohil','Michal'],turn:0}
];
const extraNames=['Refill the soap','Sort the cupboard','Check the mail','Tidy the entryway','Clean the mirror','Return library books','Restock tea','Sweep the floor','Organize the shelf'];
let tasks=structuredClone(samples),selected='assigned',busyDay=false,previous=null,toastTimer;
const root=document.querySelector('#root');
const forCategory=id=>tasks.filter(t=>t.category===id);
const taskMeta=t=>t.owners?`${t.owners[t.turn%t.owners.length]==='Michal'?'You’re next':t.owners[t.turn%t.owners.length]+'’s turn'} · ${t.id==='r1'?'As needed':'Tomorrow'}`:t.meta;
const row=t=>`<button class="task" data-task="${t.id}"><span class="check-ring" aria-hidden="true"></span><span class="task-copy"><span class="task-name">${esc(t.title)}</span><span class="task-meta">${esc(taskMeta(t))}</span></span>${t.points?`<span class="points">${esc(t.points)}</span>`:''}</button>`;
function renderStudio(){
 document.title='To-do layout concepts · Review';
 root.innerHTML=`<main class="studio"><header class="studio-heading"><div><div class="eyebrow">Household / Design studies / 01</div><h1>More of the picture.</h1><p>Category lanes now adapt to your day, with room for personal groups and a quicker way to remind yourself. Explore the updated direction alongside the two earlier studies.</p></div><span class="sample-tag">Local concepts · Sample data</span></header><div class="studio-controls"><nav class="concept-switch" aria-label="Layout concept">${Object.entries(concepts).map(([id,c])=>`<button data-concept="${id}" aria-pressed="${id===concept}"><b>${c.letter}</b>${c.name}</button>`).join('')}</nav><div class="device-switch" aria-label="Preview size"><button data-device="desktop" aria-pressed="true">Desktop</button><button data-device="phone" aria-pressed="false">Phone</button><button data-device="compare" aria-pressed="false">Compare phones</button></div></div><div class="design-note" aria-live="polite"></div><section class="preview-well" aria-label="Interactive concept preview"></section><footer class="studio-footer"><p>Try swiping a tile, lifting its corner to edit or pin, restoring a removed task, or completing a chore together in Category lanes.<br>All changes are temporary. Refresh to reset. The milk rotation is sample content only.</p><p><a id="direct-link" href="${conceptUrl(concept)}" target="_blank" rel="noopener">Open this concept on its own ↗</a><br>Compare structure first; details and colors can follow.</p></footer></main>`;
 let device='desktop';
 function preview(){
  document.querySelectorAll('[data-concept]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.concept===concept)));
  document.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.device===device)));
  const c=concepts[concept];document.querySelector('.design-note').innerHTML=device==='compare'?'<strong>Same day. Three structures.</strong><span>Category lanes is the revised direction; the other studies retain their original sample lists.</span>':`<strong>${c.title}</strong><span>${c.description} ${c.tradeoff}</span>`;
  document.querySelector('#direct-link').href=conceptUrl(concept);
  document.querySelector('.preview-well').innerHTML=device==='compare'?`<div class="compare">${Object.entries(concepts).map(([id,c])=>`<section><h2>${c.letter} / ${c.name}</h2><p>${c.tradeoff}</p><iframe class="preview-frame" src="${conceptUrl(id)}" title="${c.name} phone concept"></iframe></section>`).join('')}</div>`:`<iframe class="preview-frame ${device==='phone'?'phone':''}" src="${conceptUrl(concept)}" title="${c.name} ${device} concept"></iframe>`;
 }
 root.addEventListener('click',e=>{const c=e.target.closest('[data-concept]'),d=e.target.closest('[data-device]');if(c){concept=c.dataset.concept;preview();}if(d){device=d.dataset.device;preview();}});preview();
}
function panel(c){
 const list=forCategory(c.id),limit=concept==='lanes'?3:2;
 return `<section class="panel ${c.id}" aria-labelledby="heading-${c.id}"><header class="panel-head"><span class="category-icon">${icon(c.id)}</span><div><h2 id="heading-${c.id}">${c.title}</h2><p>${c.hint}</p></div><span class="count" aria-label="${list.length} tasks">${list.length}</span></header><div class="items">${list.length?list.slice(0,limit).map(row).join(''):'<p class="empty">All clear here.</p>'}</div><footer class="panel-foot"><button class="add-in-category" data-add="${c.id}" aria-label="Add a sample task to ${c.title}">${icon('plus')}<span> Add task</span></button><button class="view-all" data-category="${c.id}" aria-label="View all ${list.length} ${c.title} tasks">View ${list.length} ${icon('arrow')}</button></footer></section>`;
}
function focusPanel(){
 const c=categories.find(c=>c.id===selected),list=forCategory(selected);
 return `<div class="focus-layout"><nav class="category-index" aria-label="Task categories">${categories.map(c=>{const list=forCategory(c.id);return `<button class="category-tile ${c.id}" data-focus="${c.id}" aria-pressed="${selected===c.id}"><strong>${c.title}</strong><span class="count">${list.length}</span><small>${esc(list[0]?.title||'All clear here')}${list.length>1?` · +${list.length-1}`:''}</small></button>`;}).join('')}</nav><section class="focus-detail ${c.id}" aria-labelledby="focus-title"><header class="focus-heading"><div><h2 id="focus-title">${c.title}</h2><p>${c.hint}</p></div><button data-add="${c.id}" aria-label="Add a sample task to ${c.title}">＋ Add</button></header><div class="focus-cards">${list.length?list.map(t=>`<article class="focus-card"><span class="card-label">${c.short}${t.points?' · '+t.points:''}</span><h3>${esc(t.title)}</h3><p>${esc(taskMeta(t))}</p><div class="card-actions"><button data-complete="${t.id}">${icon('assigned')} Done</button><button class="details" data-task="${t.id}">Details ↗</button></div></article>`).join(''):'<p class="empty">All clear. Choose another category above.</p>'}</div><p class="context-note">The category overview stays here as you work. Your other lists are one tap away.</p></section></div>`;
}
function renderApp(){
 document.title=concepts[concept].name+' · To-do concept';
 root.innerHTML=`<main class="app" data-concept="${concept}"><header class="app-header"><span class="wordmark">${icon('home')} Household</span><nav class="app-nav" aria-label="App navigation illustration"><span>Home</span><span class="current">To-dos</span><span>Expenses</span><span>Events</span><span>Bulletin</span></nav><span class="person"><span class="avatar">M</span> Michal</span></header><div class="page-heading"><div><h1>To-dos<span style="color:#739367">.</span></h1><p>A little order for the everyday.</p></div><div class="heading-actions"><button class="primary" data-add="${selected}">＋ Add task</button></div></div><div class="summary-line"><span>${tasks.length} open</span><span class="dot"></span><span>${tasks.filter(t=>t.due).length} for you today</span><label class="sample-select"><span>Sample</span><select id="sample-size" aria-label="Sample day"><option value="typical" ${busyDay?'':'selected'}>Typical day</option><option value="busy" ${busyDay?'selected':''}>Busy day</option></select></label></div>${concept==='focus'?focusPanel():`<div class="board ${concept}">${categories.map(panel).join('')}</div>`}<div class="bottom-line"><span>Monday, November 2</span><span class="sample-note">Illustrative tasks · Changes stay in this preview</span><button data-reset>Reset sample</button></div></main><dialog id="detail-dialog" aria-labelledby="dialog-title"></dialog><div class="toast" role="status" hidden></div>`;
 document.querySelector('#sample-size').addEventListener('change',e=>{busyDay=e.target.value==='busy';reset();});
}
function reset(){tasks=structuredClone(samples);if(busyDay)for(const c of categories)extraNames.forEach((title,i)=>tasks.push({id:`extra-${c.id}-${i}`,category:c.id,title,meta:c.id==='personal'?'Personal · This week':c.id==='assigned'?'You · This week':c.id==='open'?'Anyone · No due date':'Upcoming turn · This week',details:'Extra sample task for exploring a larger list.'}));previous=null;renderApp();}
function openDialog(title,body){const d=document.querySelector('#detail-dialog');d.innerHTML=`<header class="dialog-head"><h2 id="dialog-title">${esc(title)}</h2><button class="close-dialog" data-close aria-label="Close">×</button></header>${body}`;if(!d.open)d.showModal();}
function showTask(id){const t=tasks.find(t=>t.id===id);if(!t)return;openDialog(t.title,`<p class="dialog-meta">${esc(taskMeta(t))}<br>${esc(t.details)}</p>${t.owners?`<p class="dialog-meta">Next: ${esc(t.owners[(t.turn+1)%t.owners.length])}</p>`:''}<p class="sample-note">Sample task. Changes are temporary.</p><div class="dialog-actions"><button class="primary" data-complete="${id}">${t.owners?'Complete this turn':'Mark complete'}</button><button class="secondary" data-close>Keep open</button></div>`);}
function showCategory(id){const c=categories.find(c=>c.id===id),list=forCategory(id);openDialog(c.title,`<p class="dialog-meta">${list.length} tasks · ${c.hint}.<br>Routine turns appear in Taking turns only, so they are counted once.</p><div class="dialog-list">${list.map(row).join('')||'<p class="empty">All clear here.</p>'}</div><div class="dialog-actions"><button class="primary" data-add="${id}">＋ Add sample task</button></div>`);}
function showAdd(id){const c=categories.find(c=>c.id===id)||categories[0];openDialog('Add a sample task',`<form id="add-sample"><p class="dialog-meta">Try how a new item fits in the layout.</p><label class="dialog-label" for="sample-title">Task</label><input class="dialog-input" id="sample-title" required maxlength="100" placeholder="What needs doing?" autofocus><label class="dialog-label" for="sample-category">Category</label><select class="dialog-input" id="sample-category">${categories.map(cat=>`<option value="${cat.id}" ${cat.id===c.id?'selected':''}>${cat.title}</option>`).join('')}</select><div class="dialog-actions"><button class="primary" type="submit">Add to preview</button><button class="secondary" type="button" data-close>Cancel</button></div></form>`);document.querySelector('#sample-title').focus();}
function toast(message,undo=false){clearTimeout(toastTimer);const t=document.querySelector('.toast');t.innerHTML=`<span>${esc(message)}</span>${undo?'<button data-undo>Undo</button>':''}`;t.hidden=false;toastTimer=setTimeout(()=>{t.hidden=true;},8000);}
if(demo&&concept==='lanes'){
 location.replace('./lanes.html');
}else if(demo){
 renderApp();
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-close'))document.querySelector('dialog').close();
  if(b.dataset.task)showTask(b.dataset.task);
  if(b.dataset.category)showCategory(b.dataset.category);
  if(b.dataset.add)showAdd(b.dataset.add);
  if(b.dataset.focus){selected=b.dataset.focus;renderApp();document.querySelector(`[data-focus="${selected}"]`).focus({preventScroll:true});}
  if(b.hasAttribute('data-reset')){reset();toast('Sample reset');}
  if(b.dataset.complete){const t=tasks.find(t=>t.id===b.dataset.complete);if(!t)return;previous=structuredClone(tasks);let msg='Completed in this preview';if(t.owners){t.turn++;msg=`Turn passed to ${t.owners[t.turn%t.owners.length]}`;}else tasks=tasks.filter(x=>x.id!==t.id);renderApp();toast(msg,true);}
  if(b.hasAttribute('data-undo')&&previous){tasks=previous;previous=null;renderApp();toast('Completion undone');}
 });
 root.addEventListener('submit',e=>{if(e.target.id!=='add-sample')return;e.preventDefault();const title=document.querySelector('#sample-title').value.trim(),category=document.querySelector('#sample-category').value;if(!title)return;tasks.push({id:'sample-'+Date.now(),category,title,meta:'New sample · No due date',details:'Added in this preview only.'});selected=category;renderApp();toast('Added to this preview');});
}else renderStudio();
</script>
</body>
</html>
